name: CI

on:
  pull_request:
    branches:
      - "*.*"
      - main
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: codeberg-small
    services:
      database:
        image: postgres:17.5
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: database
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
        dependencies:
            - 'lowest'
            - 'highest'

    steps:
      - name: "Checkout"
        uses: actions/checkout@v2

      - name: "Install PHP and Composer"
        uses: https://github.com/shivammathur/setup-php@v2
        with:
          tools: flex
          php-version: "${{ matrix.php-version }}"
          coverage: none

      - name: "Install dependencies"
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --no-interaction --prefer-stable --prefer-lowest
          else
            composer install --no-interaction
          fi

      - name: "Run tests"
        env:
          DATABASE_URL: "pdo-pgsql://user:password@database:5432/database?serverVersion=17.5.1"
        run: composer test

      - name: "Run example"
        env:
          DATABASE_URL: "pdo-pgsql://user:password@database:5432/database?serverVersion=17.5.1"
        run: |
          cd example; composer install; composer test

  coding-standard:
    runs-on: codeberg-tiny
    steps:
      - name: "Checkout"
        uses: actions/checkout@v2

      - name: "Install PHP"
        uses: https://github.com/shivammathur/setup-php@v2
        with:
          tools: flex
          php-version: "8.2"

      - name: "Install Composer"
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: "Install dependencies"
        run: composer install --no-interaction

      - name: "Check coding standard"
        run: composer check-cs
